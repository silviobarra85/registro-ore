name: Compilazione Java 17
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compila sorgenti
        run: mvn -B -ntp -DskipTests clean package
      - name: Regression test - posizione del Registro
        run: java -cp "target/test-classes:target/classes" it.registroore.RegistroViewportTest
      - name: Regression test - titoli e acronimi dei progetti
        run: java -cp "target/test-classes:target/classes" it.registroore.ProjectIdentityTest
      - name: Regression test - nove categorie e sospensioni
        run: java -cp "target/test-classes:target/classes" it.registroore.CategoryTaxonomyTest

      - name: Regression test - calendario e unione ore multi-giorno
        run: java -cp "target/test-classes:target/classes" it.registroore.BatchEntrySupportTest
      - name: SQLite smoke test - consolidamento e blocchi
        run: python3 tests/test_batch_sqlite.py
      - name: Regression test - primo avvio Linux Mint
        run: python3 -m unittest discover -s tests -p test_mint_bootstrap.py -v
      - name: Regression test - modifica rapida ore +/-
        run: java -cp "target/test-classes:target/classes" it.registroore.QuickHoursSupportTest

      - name: Regression test - pulsanti rapidi senza ellissi
        run: java -Djava.awt.headless=true -cp "target/test-classes:target/classes" it.registroore.QuickHourButtonTest
