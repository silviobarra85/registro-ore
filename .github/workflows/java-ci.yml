name: Compilazione Java 17
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compila sorgenti
        run: mvn -B -ntp -DskipTests clean package
      - name: Regression test - posizione del Registro
        run: java -cp target/test-classes:target/registro-ore-3.10.2.jar it.registroore.RegistroViewportTest
